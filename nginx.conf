server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 启用 gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # 静态资源缓存
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 处理前端路由（SPA）
    location / {
        try_files $uri $uri/ /index.html;
        
        # 添加必要的响应头以支持 SharedArrayBuffer
        add_header Cross-Origin-Opener-Policy 'same-origin' always;
        add_header Cross-Origin-Embedder-Policy 'require-corp' always;
    }

    # DICOM-web API 代理
    location /dicom-web {
        proxy_pass http://192.168.1.3:18997;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 添加必要的响应头
        proxy_set_header Cross-Origin-Opener-Policy 'same-origin';
        proxy_set_header Cross-Origin-Embedder-Policy 'require-corp';
        
        # 处理 CORS
        add_header Cross-Origin-Opener-Policy 'same-origin' always;
        add_header Cross-Origin-Embedder-Policy 'require-corp' always;
    }

    # Orthanc 原生 API 代理 - tools
    location /tools {
        proxy_pass http://192.168.1.3:18997;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        add_header Cross-Origin-Opener-Policy 'same-origin' always;
        add_header Cross-Origin-Embedder-Policy 'require-corp' always;
    }

    # Orthanc 原生 API 代理 - instances
    location /instances {
        proxy_pass http://192.168.1.3:18997;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        add_header Cross-Origin-Opener-Policy 'same-origin' always;
        add_header Cross-Origin-Embedder-Policy 'require-corp' always;
    }

    # Orthanc 原生 API 代理 - series
    location /series {
        proxy_pass http://192.168.1.3:18997;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        add_header Cross-Origin-Opener-Policy 'same-origin' always;
        add_header Cross-Origin-Embedder-Policy 'require-corp' always;
    }

    # WADO-URI 代理
    location /wado {
        proxy_pass http://192.168.1.3:18997;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        add_header Cross-Origin-Opener-Policy 'same-origin' always;
        add_header Cross-Origin-Embedder-Policy 'require-corp' always;
    }

    # CAD API 代理
    location /cad {
        proxy_pass http://192.168.1.3:29999;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        add_header Cross-Origin-Opener-Policy 'same-origin' always;
        add_header Cross-Origin-Embedder-Policy 'require-corp' always;
    }

    # 错误页面
    error_page 404 /index.html;
}

